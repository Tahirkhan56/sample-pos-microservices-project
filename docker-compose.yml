# Local development stack: infrastructure + all microservices behind the gateway on http://localhost:8080
# Usage:  cp .env.example .env  &&  docker compose up --build

name: pos

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: ${RABBITMQ_USER:-pos}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-pos_rabbit_password}

services:
  # ---------- Infrastructure ----------
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pos_rabbit_password}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Pos_Postgres_P@ssw0rd}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-Pos_SqlServer_P@ssw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Microservices ----------
  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Pos.Catalog.Api/Dockerfile
    image: pos/catalog-api:latest
    environment:
      <<: *dotnet-env
      RabbitMq__QueueName: pos.catalog
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=pos_catalog;Username=postgres;Password=${POSTGRES_PASSWORD:-Pos_Postgres_P@ssw0rd}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5101:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/Pos.Inventory.Api/Dockerfile
    image: pos/inventory-api:latest
    environment:
      <<: *dotnet-env
      RabbitMq__QueueName: pos.inventory
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=pos_inventory;Username=postgres;Password=${POSTGRES_PASSWORD:-Pos_Postgres_P@ssw0rd}
    ports:
      - "5102:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/Pos.Ordering.Api/Dockerfile
    image: pos/ordering-api:latest
    environment:
      <<: *dotnet-env
      RabbitMq__QueueName: pos.ordering
      ConnectionStrings__OrderingDb: Server=sqlserver,1433;Database=PosOrdering;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-Pos_SqlServer_P@ssw0rd};TrustServerCertificate=True
      Services__Catalog__BaseUrl: http://catalog-api:8080
    ports:
      - "5103:8080"
    depends_on:
      sqlserver: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      catalog-api: { condition: service_started }

  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/Pos.Payments.Api/Dockerfile
    image: pos/payments-api:latest
    environment:
      <<: *dotnet-env
      RabbitMq__QueueName: pos.payments
      ConnectionStrings__PaymentsDb: Server=sqlserver,1433;Database=PosPayments;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-Pos_SqlServer_P@ssw0rd};TrustServerCertificate=True
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
    ports:
      - "5104:8080"
    depends_on:
      sqlserver: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Pos.Gateway/Dockerfile
    image: pos/gateway:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog-api:8080
      ReverseProxy__Clusters__inventory__Destinations__primary__Address: http://inventory-api:8080
      ReverseProxy__Clusters__ordering__Destinations__primary__Address: http://ordering-api:8080
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments-api:8080
    ports:
      - "8080:8080"
    depends_on:
      - catalog-api
      - inventory-api
      - ordering-api
      - payments-api

volumes:
  rabbitmq-data:
  postgres-data:
  sqlserver-data:
