name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PointOfSale.slnx

      - name: Verify formatting
        run: dotnet format PointOfSale.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build PointOfSale.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PointOfSale.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image (${{ matrix.service.name }})
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: catalog-api, dockerfile: src/Services/Catalog/Pos.Catalog.Api/Dockerfile }
          - { name: inventory-api, dockerfile: src/Services/Inventory/Pos.Inventory.Api/Dockerfile }
          - { name: ordering-api, dockerfile: src/Services/Ordering/Pos.Ordering.Api/Dockerfile }
          - { name: payments-api, dockerfile: src/Services/Payments/Pos.Payments.Api/Dockerfile }
          - { name: gateway, dockerfile: src/Gateway/Pos.Gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/pos-${{ matrix.service.name }}:latest
            ghcr.io/${{ env.OWNER }}/pos-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
