apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pos

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - config/configmap.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/postgres.yaml
  - infrastructure/sqlserver.yaml
  - infrastructure/redis.yaml
  - services/catalog-api.yaml
  - services/inventory-api.yaml
  - services/ordering-api.yaml
  - services/payments-api.yaml
  - services/gateway.yaml
  - services/gateway-ingress.yaml
  - services/autoscaling.yaml

# Copy config/secrets.env.example to config/secrets.env first.
secretGenerator:
  - name: pos-secrets
    envs:
      - config/secrets.env
    options:
      disableNameSuffixHash: true

# Point images at your registry, e.g. `kustomize edit set image pos/catalog-api=ghcr.io/acme/pos-catalog-api:1.0.0`.
images:
  - { name: pos/catalog-api, newTag: latest }
  - { name: pos/inventory-api, newTag: latest }
  - { name: pos/ordering-api, newTag: latest }
  - { name: pos/payments-api, newTag: latest }
  - { name: pos/gateway, newTag: latest }
