apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  labels: { app.kubernetes.io/name: sqlserver }
spec:
  selector: { app.kubernetes.io/name: sqlserver }
  ports:
    - { name: tds, port: 1433, targetPort: 1433 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  labels: { app.kubernetes.io/name: sqlserver }
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sqlserver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sqlserver }
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - { name: tds, containerPort: 1433 }
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: Developer }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: pos-secrets, key: MSSQL_SA_PASSWORD } }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 2Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 4Gi } }
